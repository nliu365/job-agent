[project]
name = "job-alert"
version = "0.1.0"
description = "Automated ML/AI job scanner, resume tailor, and auto-applier"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "python-jobspy~=1.1",
    "playwright~=1.49",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "python-docx~=1.1",
    "pymupdf~=1.24",
    "weasyprint>=65.0",
    "jinja2~=3.1",
    "httpx~=0.27",
    "aiosqlite~=0.20",
    "thefuzz[speedup]~=0.22",
    "pyyaml~=6.0",
    "structlog~=24.0",
    "tenacity~=9.0",
    "aiolimiter~=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.0",
    "pytest-asyncio~=0.24",
    "respx~=0.21",
    "ruff~=0.8",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
